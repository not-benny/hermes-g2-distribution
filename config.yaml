_config_version: 37

agent:
  max_turns: 50
  verbose: false
  disabled_toolsets:
    - browser
    - code_execution
    - computer_use
    - delegation
    - file
    - terminal
    - web

auxiliary:
  hermes_g2_conversate_cues:
    provider: auto
    model: ""
    timeout: 2.25

gateway:
  platforms:
    g2:
      enabled: false
      extra:
        bind: 127.0.0.1
        port: 8790
        session_key: glasses
        allow_private_bind: false
        tls_certfile: ""
        tls_keyfile: ""
        allow_proactive_tools: true
        proactive_tool_allowlist:
          - glasses.notify_result
        hello_profile: even-g2
        tool_call_allowlist:
          - glasses.notify_result
          - glasses.work_board.add_task
          - glasses.clock.set_timer
          - glasses.clock.set_alarm
          - glasses.context_dashboard.present
          - apps.launch
          - apps.list_windows
          - apps.focus_window
          - apps.close_window
          - apps.list_folders
          - apps.move_to_folder
          - apps.remove_from_folder
          - apps.disband_folder
          - media.now_playing
          - media.play_pause
          - media.next
          - nav.start_navigation
          - nav.stop_navigation
          - nav.route_status
          - notifications.list
          - notifications.dismiss
          - health.get_ring_data
          - calendar.list_events

platform_toolsets:
  g2: []

plugins:
  enabled: []
  disabled: []
  trusted_session_context: []
