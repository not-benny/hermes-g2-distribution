name: distribution-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2 ruff==0.15.22
      - name: Reject generated cache artifacts
        run: |
          if find . -path './.git' -prune -o \( -type d \( -name __pycache__ -o -name .pytest_cache -o -name .ruff_cache -o -name .mypy_cache \) -o -type f \( -name '*.pyc' -o -name '*.pyo' \) \) -print | grep -q .; then
            echo 'Generated Python cache artifacts must not be committed.' >&2
            exit 1
          fi
      - name: Validate release locks and privacy boundary
        run: python tests/validate_distribution.py --release
      - name: Run helper tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Check Python style
        run: ruff check --no-cache scripts tests
      - name: Check shell syntax
        run: bash -n scripts/bootstrap.sh
      - name: Check shell safety
        run: shellcheck scripts/bootstrap.sh
